# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iatlas_cbioportal_export"
version = "0.1.0"
requires-python = ">=3.9,<3.12"
dependencies = [
  "synapseclient[pandas]>=4,<5",
  "pandas>=2.2",
  "pyyaml==6.0"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
